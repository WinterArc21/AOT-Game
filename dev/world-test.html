<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>World test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #info { position: fixed; left: 8px; top: 8px; color: #fff; font: 12px/1.4 monospace; text-shadow: 0 0 3px #000, 0 0 3px #000; white-space: pre; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/addons/" } }</script>
</head>
<body>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { buildWorld } from '../src/world/world.js';

// Dev harness for the world: real CollisionWorld when available (else a recording stub), free-fly camera,
// presets via URL hash (#wall #gate #forest #canopy #town #plaza #field #top #sky #platform #hq),
// ?debug draws collider wireframes, ?nofx disables shafts etc. Stats are exposed on window.__stats.
const params = new URLSearchParams(location.search);
const DEBUG = params.has('debug');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.3, 4000);
camera.rotation.order = 'YXZ';

// ---- collision (real or stub) with recording of every static collider ----
let collision;
try {
  const mod = await import('../src/core/collision.js');
  collision = new mod.CollisionWorld();
} catch (e) {
  console.warn('real CollisionWorld unavailable, using stub', e.message);
  let gf = () => 0;
  collision = { addBox: (o) => o, addCylinder: (o) => o, addCapsule: (o) => o, addSphere: (o) => o, setGround: (f) => { gf = f; }, groundHeight: (x, z) => gf(x, z), remove() {}, raycast: () => null };
}
const rec = [];
for (const k of ['addBox', 'addCylinder', 'addCapsule', 'addSphere']) {
  const orig = collision[k].bind(collision);
  collision[k] = (o) => { rec.push([k, o]); return orig(o); };
}
const game = { scene, camera, renderer, collision, events: { on() {}, off() {}, emit() {} }, time: 0, mode: 'free' };

const t0 = performance.now();
const world = buildWorld(game);
const buildMs = performance.now() - t0;
game.world = world;

// ---- sun follows the camera like the core will do ----
const sunOffset = world.sun.position.clone().sub(world.sun.target.position);
function updateSun() {
  world.sun.target.position.set(camera.position.x, 0, camera.position.z);
  world.sun.position.copy(world.sun.target.position).add(sunOffset);
  world.sun.target.updateMatrixWorld();
}

// ---- collider debug wireframes ----
if (DEBUG) {
  const pts = [];
  const seg = (a, b) => pts.push(a.x, a.y, a.z, b.x, b.y, b.z);
  const circle = (c, r, axis, n = 14) => {
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2, a1 = ((i + 1) / n) * Math.PI * 2;
      const p = (a) => axis === 'y' ? new THREE.Vector3(c.x + Math.cos(a) * r, c.y, c.z + Math.sin(a) * r) : axis === 'x' ? new THREE.Vector3(c.x, c.y + Math.cos(a) * r, c.z + Math.sin(a) * r) : new THREE.Vector3(c.x + Math.cos(a) * r, c.y + Math.sin(a) * r, c.z);
      seg(p(a0), p(a1));
    }
  };
  for (const [k, o] of rec) {
    if (k === 'addBox') {
      const h = o.halfExtents, q = o.quaternion || new THREE.Quaternion();
      const c = [];
      for (let i = 0; i < 8; i++) c.push(new THREE.Vector3((i & 1 ? 1 : -1) * h.x, (i & 2 ? 1 : -1) * h.y, (i & 4 ? 1 : -1) * h.z).applyQuaternion(q).add(o.center));
      for (const [a, b] of [[0, 1], [2, 3], [4, 5], [6, 7], [0, 2], [1, 3], [4, 6], [5, 7], [0, 4], [1, 5], [2, 6], [3, 7]]) seg(c[a], c[b]);
    } else if (k === 'addCylinder') {
      circle(new THREE.Vector3(o.x, o.y0, o.z), o.radius, 'y'); circle(new THREE.Vector3(o.x, o.y1, o.z), o.radius, 'y');
      for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) seg(new THREE.Vector3(o.x + dx * o.radius, o.y0, o.z + dz * o.radius), new THREE.Vector3(o.x + dx * o.radius, o.y1, o.z + dz * o.radius));
    } else if (k === 'addCapsule') {
      const ax = new THREE.Vector3().subVectors(o.b, o.a).normalize();
      const u = Math.abs(ax.y) > 0.9 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
      const e1 = new THREE.Vector3().crossVectors(ax, u).normalize().multiplyScalar(o.radius), e2 = new THREE.Vector3().crossVectors(ax, e1).normalize().multiplyScalar(o.radius);
      for (const s of [e1, e2, e1.clone().negate(), e2.clone().negate()]) seg(o.a.clone().add(s), o.b.clone().add(s));
      for (const p of [o.a, o.b]) { circle(p, o.radius, 'x', 8); circle(p, o.radius, 'y', 8); circle(p, o.radius, 'z', 8); }
    } else if (k === 'addSphere') { circle(o.center, o.radius, 'x'); circle(o.center, o.radius, 'y'); circle(o.center, o.radius, 'z'); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const lines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xff2bd6, fog: false, depthTest: true }));
  lines.frustumCulled = false; scene.add(lines);
}

// ---- camera presets ----
const PRESETS = {
  wall:     [[70, 24, 105], [0, 28, 0]],
  gate:     [[0, 6, 40], [0, 14, -30]],
  top:      [[0, 52, -2], [0, 40, 260]],
  topback:  [[40, 53, 4], [0, 30, -150]],
  field:    [[90, 6, 70], [-10, 22, 190]],
  forest:   [[10, 14, 205], [0, 40, 330]],
  edge:     [[-60, 30, 150], [40, 60, 260]],
  canopy:   [[0, 58, 300], [60, 62, 420]],
  under:    [[-15, 2.5, 300], [10, 40, 380]],
  platform: [[60, 30, 175], [45, 35, 215]],
  town:     [[0, 46, -12], [0, 14, -190]],
  street:   [[0, 5, -30], [0, 20, -190]],
  plaza:    [[40, 20, -120], [-20, 22, -215]],
  hq:       [[20, 40, -30], [-45, 20, -80]],
  sky:      [[0, 52, 0], [-100, 70, 600]],
  skyhigh:  [[0, 120, 100], [0, 130, 700]],
};
const key = (location.hash || '#wall').slice(1);
const preset = PRESETS[key] || PRESETS.wall;
camera.position.set(...preset[0]);
camera.lookAt(new THREE.Vector3(...preset[1]));
let yaw = camera.rotation.y, pitch = camera.rotation.x;
if (params.has('fov')) { camera.fov = +params.get('fov'); camera.updateProjectionMatrix(); }

// ---- free fly ----
const keys = {};
addEventListener('keydown', (e) => { keys[e.code] = true; });
addEventListener('keyup', (e) => { keys[e.code] = false; });
let drag = false;
renderer.domElement.addEventListener('mousedown', () => { drag = true; });
addEventListener('mouseup', () => { drag = false; });
addEventListener('mousemove', (e) => { if (!drag) return; yaw -= e.movementX * 0.003; pitch = Math.max(-1.5, Math.min(1.5, pitch - e.movementY * 0.003)); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const info = document.getElementById('info');
let last = performance.now(), frames = 0, statsDone = false;
const MAXF = params.has('frames') ? +params.get('frames') : Infinity;
const fwd = new THREE.Vector3(), right = new THREE.Vector3();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; frames++;
  const sp = (keys.ShiftLeft ? 120 : 30) * dt;
  camera.rotation.set(pitch, yaw, 0);
  camera.getWorldDirection(fwd); right.crossVectors(fwd, camera.up).normalize();
  if (keys.KeyW) camera.position.addScaledVector(fwd, sp);
  if (keys.KeyS) camera.position.addScaledVector(fwd, -sp);
  if (keys.KeyD) camera.position.addScaledVector(right, sp);
  if (keys.KeyA) camera.position.addScaledVector(right, -sp);
  if (keys.KeyE) camera.position.y += sp;
  if (keys.KeyQ) camera.position.y -= sp;
  game.time += dt;
  world.update(dt, camera.position);
  updateSun();
  renderer.info.reset();
  renderer.render(scene, camera);
  if (frames === 3 && !statsDone) {
    statsDone = true;
    let staticTris = 0; const byName = {};
    scene.traverse((o) => { if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return; const g = o.geometry; let t = (g.index ? g.index.count : g.attributes.position.count) / 3; if (o.isInstancedMesh) t *= o.count; staticTris += t; const nm = (o.parent && o.parent.isMesh ? o.parent.name + '+outline' : o.name || 'unnamed').replace(/\d+/g, '#'); byName[nm] = (byName[nm] || 0) + Math.round(t); });
    window.__byName = byName;
    window.__stats = { staticTris: Math.round(staticTris), buildMs: Math.round(buildMs), calls: renderer.info.render.calls, triangles: renderer.info.render.triangles, geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures, colliders: rec.length, ...world.stats };
    console.log('STATS ' + JSON.stringify(window.__stats));
    const rc = collision.raycast ? collision.raycast(new THREE.Vector3(0, 60, 0), new THREE.Vector3(0, -1, 0), 100, {}) : null;
    const cs = collision.collideSphere ? collision.collideSphere(world.playerSpawn.position, 0.5) : [];
    console.log('STATS spawn raycast down from (0,60,0): ' + (rc ? 'y=' + rc.point.y.toFixed(2) + ' ' + rc.collider.type : 'none') + '; spawn y=' + world.playerSpawn.position.y + '; contacts at spawn=' + cs.length + '; inFoliage(spawn)=' + world.inFoliage(world.playerSpawn.position));
    console.log('STATS ' + JSON.stringify(byName));
  }
  info.textContent = `#${key}  pos ${camera.position.x.toFixed(0)}, ${camera.position.y.toFixed(0)}, ${camera.position.z.toFixed(0)}\n` +
    `draw calls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k  colliders ${rec.length}  build ${buildMs.toFixed(0)} ms\nWASD/QE fly, drag look, shift fast`;
  if (frames >= MAXF) { window.__done = true; return; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__game = game;
</script>
</body>
</html>
